<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top 10 Posts</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <h1>Listado </h1>
    
    <div id="loading" class="loading">Cargando datos...</div>
    
    <table id="postsTable" style="display: none;">
        <thead>
            <tr>
                <th style="width: 10%;">ID</th>
                <th style="width: 45%;">Título</th>
                <th style="width: 45%;">Cuerpo</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>

    <script>
    // esta funcion es para hacer las letras mayusculas 
        function capitalizarPalabras(texto) {
            return texto
                .split(' ')
                .map(palabra => palabra.charAt(0).toUpperCase() + palabra.slice(1))
                .join(' ');
        }

        // esto limita los caracteres en 50 
        function recortarTexto(texto) {
            if (texto.length > 50) {
                return texto.substring(0, 50) + '...';
            }
            return texto;
        }

        // Petición Fetch 
        document.addEventListener('DOMContentLoaded', () => {
            fetch('https://jsonplaceholder.typicode.com/posts')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Error en la petición');
                    }
                    return response.json();
                })
                .then(posts => {
                    // primeros 10
                    const primerosDiez = posts.slice(0, 10);
                    const tableBody = document.getElementById('tableBody');

                    // filas de la tabla 
                    primerosDiez.forEach(post => {
                        const fila = document.createElement('tr');
                        
                        // Aplicar los formatos requeridos
                        const tituloFormateado = capitalizarPalabras(post.title);
                        const cuerpoFormateado = recortarTexto(post.body);

                        fila.innerHTML = `
                            <td><strong>${post.id}</strong></td>
                            <td>${tituloFormateado}</td>
                            <td>${cuerpoFormateado}</td>
                        `;
                        
                        tableBody.appendChild(fila);
                    });

                    // oculta el mensaje y muestra la tabla 
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('postsTable').style.display = 'table';
                })
                .catch(error => {
                    console.error('Hubo un problema con la petición Fetch:', error);
                    document.getElementById('loading').innerText = 'Error al cargar los datos.';
                });
        });
    </script>

</body>
</html>
